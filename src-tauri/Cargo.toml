[package]
name = "cephalon-merlin"
version = "0.2.1"
description = "Cephalon Merlin â€“ Warframe companion"
authors = ["TvMerlinTv"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cephalon_merlin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_WinRT"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# Eingebaute OberflÃ¤che (dist/) statt Dev-Server â€“ setzt `tauri build` sonst automatisch
custom-protocol = ["tauri/custom-protocol"]
